[package]
name = "vox-client"
version = "0.1.0"
edition = "2024"
description = "Play Vox: walk into a world with your character. Runs on the desktop and, built for WebAssembly, in the browser."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vox-client"
path = "src/main.rs"

[dependencies]
vox-world = { path = "../world" }
vox-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = "0.19.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", features = ["webgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response", "Request", "RequestInit", "Headers"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
