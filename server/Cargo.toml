[package]
name = "vox-server"
version = "0.1.0"
edition = "2024"
description = "A Vox world server: one shared build space, its players and its blocks, kept in SQLite."

[dependencies]
vox-core = { path = "../core" }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3.34"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
