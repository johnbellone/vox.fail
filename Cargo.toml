# The Vox workspace: no package here, so `cargo build` builds everything.
[workspace]
# Rust libraries in crates/, Rust programs in bins/ (Bun web apps are in apps/, see package.json).
members = ["bins/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Every shared dependency once: members write `name.workspace = true` (adding features if they
# need more), so the crates can't drift apart.
[workspace.dependencies]
vox-core = { path = "crates/vox-core" }
vox-world = { path = "crates/vox-world" }
avatar-voice = { path = "crates/avatar-voice" }
vox-voice = { path = "crates/vox-voice" }
vox-link = { path = "crates/vox-link" }
vox-format = { path = "crates/vox-format" }
vox-server = { path = "bins/vox-server" }
bevy = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = { version = "1", features = ["use-std"] }
getrandom = "0.3"
png = "0.18"
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
axum = "0.8"
futures-util = "0.3.34"
tokio = "1"
tokio-tungstenite = "0.30.0"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
codegen-units = 16

# The browser client: smaller and a little slower to build.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
codegen-units = 16
strip = true
lto = "thin"
