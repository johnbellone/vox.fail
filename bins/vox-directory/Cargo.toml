[package]
name = "vox-directory"
version.workspace = true
edition.workspace = true
description = "Vox's directory: accounts, characters, sign-in tokens for world servers, and the web pages where people sign in, make a character and play."

[dependencies]
vox-core.workspace = true
axum.workspace = true
tower-http = { version = "0.6", features = ["fs"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
argon2 = "0.5"
getrandom.workspace = true
sha2 = "0.10"
reqwest.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["cookies"] }
