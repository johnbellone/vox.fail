[package]
name = "vox-client"
version.workspace = true
edition.workspace = true
description = "Play Vox: walk into a world with your character. Runs on the desktop and, built for WebAssembly, in the browser."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vox-client"
path = "src/main.rs"

[dependencies]
vox-world.workspace = true
vox-core.workspace = true
serde.workspace = true
serde_json.workspace = true
bevy.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Response", "Request", "RequestInit", "Headers"] }
getrandom = { workspace = true, features = ["wasm_js"] }
