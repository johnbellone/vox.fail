[package]
name = "vox-server"
version.workspace = true
edition.workspace = true
description = "A Vox world server: one shared build space, its players and its blocks, kept in SQLite."

[dependencies]
vox-core.workspace = true
vox-format.workspace = true
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[dev-dependencies]
tokio-tungstenite.workspace = true
