[package]
name = "vox-server"
version.workspace = true
edition.workspace = true
description = "A Vox world server: one shared build space, its players and its blocks, kept in SQLite."

[dependencies]
vox-core.workspace = true
vox-format.workspace = true
# the dialling end of links to neighbouring worlds (neighbours.rs)
vox-link.workspace = true
vox-art = { path = "../../crates/vox-art" }
vox-graph = { path = "../../crates/vox-graph" }
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[dev-dependencies]
# the end-to-end voice test plays a real recording through the server
avatar-voice.workspace = true
vox-voice.workspace = true
tokio-tungstenite.workspace = true
