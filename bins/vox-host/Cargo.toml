[package]
name = "vox-host"
version.workspace = true
edition.workspace = true
description = "Many Vox worlds in one process, on one port, told apart by path (/w/<id>/ws)."

[dependencies]
vox-core.workspace = true
vox-server.workspace = true
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[dev-dependencies]
tokio-tungstenite.workspace = true
