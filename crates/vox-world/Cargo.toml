[package]
name = "vox-world"
version.workspace = true
edition.workspace = true
description = "A Vox world on screen: blocks, sky and weather, portals, the link to a world server, walking and building. Shared by the desktop app and the player client (desktop and browser)."

[dependencies]
bevy.workspace = true
vox-core.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
png.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vox-link.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Window", "Storage", "Location"] }
