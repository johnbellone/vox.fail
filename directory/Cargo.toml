[package]
name = "warren-directory"
version = "0.1.0"
edition = "2024"
description = "Warren's directory: accounts, characters, sign-in tokens for world servers, and the web pages where people sign in, make a character and play."

[dependencies]
warren-core = { path = "../core" }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
getrandom = "0.3"
sha2 = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
