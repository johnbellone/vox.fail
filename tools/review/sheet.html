<!doctype html>
<!-- A sheet of an avatar's poses and faces, rendered by three.js from its glTF: the page
     render_sheet.mjs opens. ?model=<url>&shots=<json>&cols=<n>; sets the title to "done". -->
<html><head><meta charset="utf-8"><style>body{margin:0;background:#20242c}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><canvas id="sheet"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const P = new URLSearchParams(location.search);
const shots = JSON.parse(P.get('shots'));
const cell = 360, cols = +P.get('cols') || 4, rows = Math.ceil(shots.length / cols);
const sheet = document.getElementById('sheet'); sheet.width = cols * cell; sheet.height = rows * (cell + 34);
const g = sheet.getContext('2d'); g.fillStyle = '#20242c'; g.fillRect(0, 0, sheet.width, sheet.height);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(cell, cell); renderer.setClearColor(0x3a4250);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(2, 4, 3); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(1.2, 48), new THREE.MeshStandardMaterial({ color: 0x5a6476 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
try {
  const gltf = await new GLTFLoader().loadAsync(P.get('model'));
  scene.add(gltf.scene);
  gltf.scene.traverse(o => { if (o.isMesh) { o.material.metalness = 0; o.material.roughness = 1; } });
  const mixer = new THREE.AnimationMixer(gltf.scene);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
  shots.forEach((s, i) => {
    mixer.stopAllAction();
    const clip = gltf.animations.find(a => a.name === s.clip);
    if (!clip) throw new Error(`no clip called ${s.clip}`);
    const act = mixer.clipAction(clip); act.reset(); act.play(); mixer.setTime(s.t);
    const yaw = (s.yaw ?? 30) * Math.PI / 180, d = s.dist ?? 4.4, h = s.h ?? 0.9;
    cam.position.set(Math.sin(yaw) * d, h + 0.35, Math.cos(yaw) * d); cam.lookAt(0, s.look ?? 0.78, 0);
    renderer.render(scene, cam);
    const x = (i % cols) * cell, y = Math.floor(i / cols) * (cell + 34);
    g.drawImage(renderer.domElement, x, y);
    g.fillStyle = '#e8ecf2'; g.font = '600 18px sans-serif'; g.textAlign = 'center';
    g.fillText(s.label ?? s.clip, x + cell / 2, y + cell + 24);
  });
  document.title = 'done';
} catch (e) { document.title = 'error: ' + e.message; }
</script></body></html>
