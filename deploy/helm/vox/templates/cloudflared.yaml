{{- /* A Cloudflare Tunnel to the edge, as vox.fail runs today: cloudflared dials out to
       Cloudflare, so nothing in the cluster needs to be reachable from outside. The tunnel's
       routes are set in the dashboard: one public hostname to http://<edge service>:<port>. */ -}}
{{- if .Values.cloudflared.enabled }}
{{- $c := .Values.cloudflared }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vox.fullname" . }}-cloudflared
  labels:
    {{- include "vox.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudflared
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      {{- include "vox.selector" (list . "cloudflared") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vox.labels" . | nindent 8 }}
        {{- include "vox.selector" (list . "cloudflared") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
          imagePullPolicy: {{ $c.image.pullPolicy }}
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $c.tokenSecret }}
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
{{- end }}
