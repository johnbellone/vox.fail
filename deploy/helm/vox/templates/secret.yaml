{{- /* The shared secrets, unless an existing Secret is named. The world secret, if not given,
       is made up once and then kept: upgrading must not change it under running worlds. */ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "vox.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $world := .Values.secrets.worldSecret }}
{{- if not $world }}
{{- if and $old $old.data (hasKey $old.data "VOX_WORLD_SECRET") }}
{{- $world = index $old.data "VOX_WORLD_SECRET" | b64dec }}
{{- else }}
{{- $world = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vox.labels" . | nindent 4 }}
type: Opaque
stringData:
  VOX_WORLD_SECRET: {{ $world | quote }}
  VOX_DISCORD_CLIENT_ID: {{ .Values.secrets.discordClientId | quote }}
  VOX_DISCORD_CLIENT_SECRET: {{ .Values.secrets.discordClientSecret | quote }}
  VOX_STEAM_KEY: {{ .Values.secrets.steamKey | quote }}
{{- end }}
