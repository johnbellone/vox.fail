{{- /* Who may talk to whom: anyone to the edge; only the edge and the worlds to the directory
       (the worlds report to it and fetch plots and portals); only the edge to the worlds. */ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vox.directory" . }}
  labels:
    {{- include "vox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vox.selector" (list . "directory") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vox.selector" (list . "edge") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vox.selector" (list . "world") | nindent 14 }}
      ports:
        - port: {{ .Values.directory.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vox.fullname" . }}-worlds
  labels:
    {{- include "vox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vox.selector" (list . "world") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vox.selector" (list . "edge") | nindent 14 }}
{{- end }}
