<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Void · Warren</title>
<link rel="icon" href="/assets/icon.png">
<link rel="stylesheet" href="/warren.css">
<script type="module" src="/play.js"></script>
</head>
<body class="playing">
<canvas id="game" tabindex="0" aria-label="The world"></canvas>
<div class="opening" id="opening" aria-live="polite">
  <div>
    <p class="wordmark">WARREN</p>
    <div class="bar"><i id="bar"></i></div>
    <p class="quiet" id="status">Opening the Void…</p>
    <p class="error" id="error" role="alert"></p>
    <p id="back" hidden><a href="/">Back to the start</a></p>
  </div>
</div>
<div class="corner">
  <p class="wordmark small"><a href="/">WARREN</a></p>
</div>
<div class="keys" id="keys" hidden>Click to walk · wheel to zoom · Q and E to turn · right click to build · V for the shoulder view</div>
</body>
</html>
