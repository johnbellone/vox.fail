<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your character · Vox</title>
<link rel="icon" href="/assets/icon.png">
<link rel="stylesheet" href="/vox.css">
<script type="module" src="/create.js"></script>
</head>
<body>
<div class="void" aria-hidden="true"><div class="moon great"></div><div class="moon red"></div><div class="moon cold"></div><div class="floor"></div></div>
<main class="page">
  <div class="top" id="top">
    <p class="wordmark small"><a href="/">VOX</a></p>
  </div>
  <div class="maker">
    <section class="stage" aria-label="Your character, turning">
      <canvas id="view"></canvas>
      <div class="loading" id="loading">Loading…</div>
      <div class="fallback" id="fallback" hidden><img id="fallback-img" alt=""></div>
      <div class="who"><strong id="who-name"></strong><span class="quiet" id="who-about"></span></div>
    </section>
    <section class="slab">
      <h2>Who are you in Vox?</h2>
      <p class="quiet">Pick someone to be, then something to wear. You can change it whenever you like.</p>
      <div id="groups"></div>
      <h3 id="hat-h">On your head</h3>
      <div class="wear" id="hat" role="group" aria-labelledby="hat-h"></div>
      <h3 id="face-h">On your face</h3>
      <div class="wear" id="face" role="group" aria-labelledby="face-h"></div>
      <h3 id="hand-h">In your hand</h3>
      <div class="wear" id="hand" role="group" aria-labelledby="hand-h"></div>
      <div class="save">
        <div class="row"><button type="button" id="save">Save character</button><span class="quiet" id="saved" role="status"></span></div>
        <p class="error" id="error" role="alert"></p>
      </div>
    </section>
  </div>
</main>
</body>
</html>
